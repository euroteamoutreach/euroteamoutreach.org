baseURL = "https://euroteamoutreach.org/"
locale = "en-US"
title = "Euro Team Outreach"
enableRobotsTXT = true

# Pagination
[pagination]
  pagerSize = 8

# Permalinks — the datestamped blog filename IS the slug, so legacy post URLs
# are reproducible (2026-05-27-teaching-serving-standing.md → /blog/2026-05-27-teaching-serving-standing/).
# Mirrors ofreport (#31, #47).
[permalinks]
  blog = "/blog/:slug/"

# Taxonomies — tags only, no categories (#47)
[taxonomies]
  tag = "tags"

# RSS output
[services.rss]
  limit = 10

[outputFormats.RSS]
  baseName = "feed"

# ─────────────────────────────────────────────────────────────────────────────
# TEMPORARY — the pre-UGO launch track (#21). Remove when the blog migrates.
#
# Netlify serves every path this site does not build from the legacy S3 site
# (the fall-through rule at the end of netlify.toml). The two blocks below keep
# this site from building the paths legacy still owns.
#
# 1. No home RSS. The RSS baseName above makes the home feed /feed.xml — the
#    exact path MailChimp's RSS automation polls. A new-site feed there would
#    list this site's pages as items, and MailChimp could email them to the
#    whole list. Until the blog migrates, /feed.xml must fall through to the
#    legacy feed unchanged. Restore "rss" here in the blog-migration PR, after
#    pausing the automation (09-blog-migration.md).
[outputs]
  home = ["html"]

# 2. Unbuilt pages stay unrendered, so their legacy versions show instead of an
#    empty stub. Delete a path from this list in the PR that builds its page.
#    Anything linking to these (menus, footer) uses a literal url, not pageRef /
#    GetPage — an unrendered page has an empty permalink.
[[cascade]]
  [cascade.build]
    render = "never"
    list = "never"
  [cascade.target]
    path = "{/about,/approach,/serve,/blog,/blog/**,/tags,/tags/**}"

# Minification. Disable XML so the feed's <content:encoded> keeps its literal
# <![CDATA[…]]> wrapper (the tdewolff minifier would otherwise rewrite it as
# entity-encoded HTML). CDATA is the more robustly-interpreted form for HTML
# inside content:encoded across RSS/MailChimp consumers. HTML/CSS/JS
# minification is unaffected; only feed.xml and sitemap.xml ship with
# whitespace preserved (both still valid; negligible after gzip). Not optional.
[minify]
  disableXML = true

# Migrated Middleman blog posts carry raw HTML, so Goldmark must not escape it.
[markup.goldmark.renderer]
  unsafe = true

# Site parameters
[params]
  description = "Euro Team Outreach — preaching the Gospel, teaching the Bible, discipling men in missions."
  # ETO's Cloudinary cloud name. PUBLIC, not a secret — delivery needs only this.
  # The API key/secret are needed only to UPLOAD and never enter the repo (#60).
  cloudinaryBase = "https://res.cloudinary.com/euro-team-outreach"

  # The production origin, for canonical links (seo.html) and Umami's
  # data-domains. Keep it equal to baseURL above, but never swap baseURL in for
  # it in templates: deploy previews build with -b $DEPLOY_PRIME_URL, which
  # rewrites baseURL to the *.netlify.app host, and a preview must never
  # declare itself canonical.
  canonicalBaseURL = "https://euroteamoutreach.org/"

  # Default share image (Open Graph / X cards) for any page without a photo of
  # its own: the legacy home cover photo, as on the home hero. Cloudinary
  # public ID; seo.html crops it to 1200×630.
  ogImage = "eto/eto-cover-2018_kp06lc"

  # Umami analytics — this site's own website record in the shared Umami
  # instance (unlike ofreport, which reused one). The ID is public: it ships in
  # every page's source. Set ahead of the DNS cutover (#31) on purpose: the
  # script loads on the *.netlify.app production URL too, but analytics.html's
  # data-domains makes Umami count only euroteamoutreach.org, so nothing is
  # recorded until DNS points here. analytics.html emits nothing outside
  # production.
  [params.umami]
    scriptUrl = "https://lens.euroteamoutreach.org/script.js"
    websiteId = "c4fe717a-afe9-475f-a5f3-bd0784bdc40e"

  # Givebutter (#12, #51) — the /give/ donation form. All PUBLIC values: the
  # account key and widget ID appear in the page source of any site that embeds
  # them, and nothing here can move money. Campaign "Give to Euro Team Outreach"
  # (code BRWFQV). campaignUrl is the hosted page, linked as the fallback when
  # the widget script is blocked.
  [params.givebutter]
    account = "PADVwpfbw1ny2chu"
    widget = "gkVll6"
    campaignUrl = "https://givebutter.com/euroteamoutreach"

  # MailChimp newsletter signup (mailchimp-form.html). PUBLIC values: both IDs
  # ship in the form's action URL. `user` is the account, `audience` is the
  # ETO Newsletter audience — the same one the blog RSS campaign sends to, so a
  # new subscriber gets those emails too. Verified against the account's
  # Audience → Settings on 2026-10-12. The audience is single opt-in with
  # reCAPTCHA on, so the visitor finishes on MailChimp's page in a new tab.
  [params.mailchimp]
    endpoint = "https://euroteamoutreach.us6.list-manage.com/subscribe/post"
    user = "672df31cd6d0e7132c9c4c7d1"
    audience = "d107e57061"

# Build stats feed Tailwind v4's JIT scan (@source "hugo_stats.json" in main.css).
# The cachebuster invalidates the generated CSS whenever the class list changes.
[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'

# Module mounts for the Tailwind pipeline. hugo_stats.json is mounted with
# disableWatch = true so the build writing it doesn't trigger an infinite
# rebuild loop.
[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'

# Security. Hugo 0.165 dropped tailwindcss from the default exec allow-list, so
# css.TailwindCSS fails without this. Setting `allow` REPLACES Hugo's default
# list rather than extending it: the first five entries are the 0.168 defaults
# (from `hugo config`), and tailwindcss is the only addition. Re-check the
# defaults on each Hugo bump.
[security.exec]
  allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']

# Hugo 0.166 refuses to run Node tools (Tailwind) if any symlink under the
# project resolves outside security.node.permissions.allowRead, and it walks the
# whole project to check — ignoreFiles does not exempt a directory. The local
# docs/prd and docs/debriefs symlinks point into the private planning repo, so
# their exact targets are allowed here. '.' is Hugo's default and must stay.
# Local-only in effect: both symlinks are gitignored, and on CI/Netlify these
# paths don't exist, so Hugo drops them as unresolvable.
[security.node.permissions]
  allowRead = ['.', '../planning/prd', '../planning/debriefs']

# Main navigation. "ETO" (the brand/home link) is rendered separately by the
# header, following ofreport's brand-plus-menu pattern; these are the
# destination items. Give carries button = true so the header styles it as a
# button, not a plain link (#24) — the header keys off that param and never
# off the entry's name, so the gold-only-on-giving rule survives a menu edit.
[[menus.main]]
  name = "Our Story"
  url = "/about/"
  weight = 10
[[menus.main]]
  name = "UGO"
  pageRef = "/ugo/"
  weight = 20
[[menus.main]]
  name = "Blog"
  url = "/blog/"
  weight = 40
[[menus.main]]
  name = "Team"
  url = "/team/"
  weight = 50
[[menus.main]]
  name = "Connect"
  pageRef = "/contact/"
  weight = 60
# Give is LAST on purpose, and the gap to 100 is deliberate headroom so a
# nav item added later cannot land after it. It is the only button in the
# bar, and a filled element that size needs an edge to anchor to — suspended
# mid-row (it was weight 30, between UGO and Blog) it read as an accident
# rather than as hierarchy. Position is menu data, so it is fixed here and
# the header template stays a pure weight-ordered render.
[[menus.main]]
  name = "Give"
  pageRef = "/give/"
  weight = 100
  [menus.main.params]
    button = true

# Footer utility links (Phase 2 footer.html renders these).
[[menus.footer]]
  name = "Meet Jesus"
  url = "/jesus/"
  weight = 10
[[menus.footer]]
  name = "Doctrine"
  url = "/doctrine/"
  weight = 20
[[menus.footer]]
  name = "Connect"
  pageRef = "/contact/"
  weight = 30

# Footer social icons. Each entry's `icon` param maps to assets/img/social-{icon}.svg,
# which footer.html inlines so the mark inherits the link's hover/focus colour.
#
# EXACTLY TWO ACCOUNTS — this is the complete set, not a starting point. Both URLs
# come from the legacy footer partial and are cross-checked against all three legacy
# sites plus the Middleman feature spec, which asserts them. Joshua confirmed both
# accounts are current (2026-07-28). The legacy footer had no YouTube, Instagram, or
# LinkedIn because ETO has no such accounts; the UGO YouTube playlists live on /ugo/,
# not in global chrome. Do not add speculative slots here.
#
# Twitter is X now, and the icon, label, and URL all say X — a half-migrated social
# link is the one outcome worth avoiding. twitter.com/eto_ukraine still 301s here, so
# using x.com drops a redirect hop and matches what the address bar shows anyway.
[[menus.footer_social]]
  name = "Facebook"
  url = "https://www.facebook.com/euroteamoutreach"
  weight = 10
  [menus.footer_social.params]
    icon = "facebook"
    label = "ETO on Facebook"
[[menus.footer_social]]
  name = "X"
  url = "https://x.com/eto_ukraine"
  weight = 20
  [menus.footer_social.params]
    icon = "x"
    label = "ETO on X"
