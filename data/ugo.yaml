# UGO — the single source of truth for project facts, stats, video, and photos.
#
# Read by /ugo/ (layouts/ugo.html), every project page /ugo/<id>/
# (layouts/ugo-project.html), and the home page's UGO card. Page prose lives
# in content/ugo/_index.md and content/_index.md; it reaches these values only
# through the {tokens} that layouts/partials/ugo-copy.html replaces, so no
# date or price is ever typed into copy (#54).
#
# Each project's record (name, dates, tally, video updates) is its own file in
# data/ugo/projects/, and that file makes its page: data/ugo/projects/2026.yaml
# is /ugo/2026/. Hugo merges that folder into this file as `projects`.

# ─────────────────────────────────────────────────────────────────────────────
# THE PHASE RUNBOOK. Every phase change is an edit here, set by hand: nothing
# on the site reads today's date.
#
#   live       a project is on the road. The happening-now band on every
#              page, the pulsing dot beside UGO in the nav, and /ugo/ opens
#              with "UGO 2026: live from Ukraine".
#   wrapup     the weeks after a trip (two to six). /ugo/ still opens with
#              the project, "UGO 2026 is complete", with its final tally;
#              no band, no dots.
#   offseason  the rest of the year. /ugo/ is the general page about UGO;
#              past projects are linked from "From the field".
#
# A project's own page, /ugo/<id>/, shows its full record in every phase.
#
# ▶ START A PROJECT (the night before the first video)
#   1. Copy the latest file in data/ugo/projects/ to a new one named for the
#      project: 2027.yaml. Its name is the page's address (/ugo/2027/), which
#      never changes once the trip starts. If a year might have two trips,
#      name the first one so it reads as one of two: 2027-spring.yaml.
#   2. In it: set name, start, end, description, cover and playlist; set every
#      tally value to 0 (the tally hides until a figure moves); empty
#      `updates:` down to the first one.
#   3. Here: `current: "2027"` (the file's name, in quotes) and `phase: live`.
#   4. Delete `trip:` below if it holds this project's dates. While live,
#      the copy reads the dates from the project's file instead.
#
# ▶ ADD TONIGHT'S UPDATE (in the current project's file)
#   1. Copy this, paste it as the FIRST entry under `updates:`, fill it in:
#
#        - day: 1
#          date: 2026-10-17
#          place: "Zhytomyr"
#          title: "Short headline, as on the video"
#          text: "One or two sentences, e.g. the first line of the YouTube description."
#          youtube: "VIDEO_ID"
#
#      `youtube` is the 11 characters after /shorts/ in the video's link.
#      `text` is optional: delete the line to leave it out.
#      `day` can be text instead of a number, in quotes, for a video before or
#      outside the trip days: day: "Getting ready" reads "Getting ready",
#      not "Day N", and the band drops "is underway".
#   2. Bump any tally figures that changed.
#   3. Save, then: git commit -am "chore(ugo): day 1 update" && git push
#      Netlify deploys main in about a minute.
#
#   Several videos in a day: one entry per video, same `day`, each with its
#   own `place`. The newest one goes on top.
#
#   No laptop? Edit the file on github.com in a phone browser (pencil icon,
#   then "Commit changes" to main); Netlify deploys it the same way. Full
#   runbook: "UGO site update from a phone" in the Obsidian vault. If even that
#   fails, just add the videos to the project's YouTube playlist; the page
#   links to it.
#
#   The newest update drives everything: the band's day and place, the
#   "Updated" stamp, and the featured video. Nothing else needs editing.
#
# ▶ GO TO WRAP-UP (the day after the last video)
#   1. `phase: wrapup`. Keep `current`.
#   2. Final tally figures in the project's file.
#   3. Add the project to `stats:` below (and `playlists:`, if not there yet).
#
# ▶ GO OFFSEASON (two to six weeks later)
#   1. `phase: offseason`. `current` can stay; offseason doesn't read it.
#
# ▶ THE NEXT PROJECT'S DATES ARE SET (in any phase)
#   Fill in `trip:` below. The copy on /ugo/ and home goes back to "we're
#   going back" with the dates; delete it again when that project starts.
# ─────────────────────────────────────────────────────────────────────────────
phase: wrapup
# The featured project: a file name in data/ugo/projects/, in quotes.
current: "2026"

# Where the videos go out each night, linked under every project's updates.
# Joshua's own profile is listed first: it has by far the larger following.
follow:
  - label: "Joshua on Facebook"
    url: "https://www.facebook.com/joshukraine"
    icon: facebook
  - label: "ETO on Facebook"
    url: "https://www.facebook.com/euroteamoutreach"
    icon: facebook
  - label: "ETO on Instagram"
    url: "https://www.instagram.com/euroteamoutreach/"
    icon: instagram
  - label: "ETO on YouTube"
    url: "https://www.youtube.com/@euroteamoutreach"
    icon: youtube

# The NEXT project's dates, once they are set; absent until then. The ONLY
# place they exist. {trip_dates} renders as "October 17–26, 2026"; a trip
# spanning two months renders both names. While it is set, the copy on /ugo/
# and home speaks of the project as coming (each copy string's `upcoming`
# version, content/ugo/_index.md); while it is absent, the phase's version.
#
# trip:
#   start: 2027-10-16
#   end: 2027-10-25

# The track-record band. Rounded ballparks for boxes and books; Nathan keeps
# the precise records (planning/copy/ugo.md §2). Villages counts only the
# de-occupied south (10 in 2024 + 11 in 2025); the Zhytomyr-area outreach is
# well north of the front and deliberately not included. The books figure is
# UGO-only, and its label says so; the ministry-wide total is on the home
# Good and Evil card (content/_index.md).
stats:
  - value: "2"
    label: "field projects since 2024"
  - value: "21"
    label: "villages reached near the front"
  - value: "1,500"
    label: "aid boxes placed in Ukrainian hands"
  - value: "1,000+"
    label: "*Good and Evil* books given out on UGO trips"

# Box counts for the give band. Each amount is box_price (data/designations.yaml)
# times the count, so a price change rewrites the whole table.
give_band_boxes: [1, 5, 10, 25]

# YouTube playlists of short field updates, newest first.
playlists:
  - title: "UGO 2026"
    list: PLI3oo5KuS4Pg
  - title: "UGO 2025"
    list: PLwBim7LWPkXWNlbUWqyRbQACx3p7EG4Wt
  - title: "UGO 2024"
    list: PLwBim7LWPkXVHyH1OtgqtTQU0SyhVNBzn

# Field photos. `id` is the Cloudinary public ID, verbatim: the uploader added
# a random suffix to each. width/height are the delivered (EXIF-rotated)
# dimensions, used to reserve layout space. Cloudinary applies EXIF orientation
# on delivery, which the two portrait shots and three 180°-stored shots need
# (checked 2026-10-06).
#
# `caption` is the visible figcaption (markdown, for the italic book title);
# `alt` describes the image for someone who cannot see it. Published-copy
# conventions apply: russia/russian lowercase, Lviv without an apostrophe.
#
# Slot → photo mapping: planning/copy/ugo.md §8. Rationale per photo:
# assets/UGO/field-photos/photo-review.md (planning repo).
photos:
  featured:
    hero:
      # IMG_7382 with the hot-pink sweater recoloured denim blue (Cloudinary
      # generative recolour, baked into one upload) to sit with the palette.
      # The original, ugo/IMG_7382_rhjbix, is untouched in Cloudinary.
      id: ugo/IMG_7382-blue_v1za1e
      width: 3024
      height: 4032
      alt: "A smiling older woman holds an aid box with a loaf of bread on top in one arm and a bundle of Bible literature in the other."
      caption: "A woman heads home with all she can carry — an aid box, a fresh loaf balanced on top, and a bundle of Bible literature."
    what_is_ugo:
      id: ugo/nathan-loading-van_sqdmxn
      width: 5712
      height: 4284
      alt: "Nathan Day stacks cardboard aid boxes into the back of a van."
      caption: "Nathan Day stacks the van with aid boxes before the day's run — every box headed for a family near the front."
    gospel:
      id: ugo/joshua-preaching-zhytomyr_pgk6xo
      width: 4032
      height: 3024
      alt: "Joshua Steele preaches to a crowd pressed in close around him."
      caption: "Joshua preaches the Gospel in Ukrainian to a crowd gathered in close in Zhytomyr."
    aid:
      id: ugo/IMG_3535_xo2lky
      width: 5712
      height: 4284
      alt: "Team members hand out aid boxes from the open back of a loaded van as villagers queue."
      caption: "The team works from the back of a loaded van, handing out aid box by box as a village gathers close."
    next_banner:
