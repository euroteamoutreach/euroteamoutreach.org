# UGO — the single source of truth for trip facts, stats, video, and photos.
#
# Read by /ugo/ (layouts/ugo.html) and, from #28, by the home page's featured
# UGO band. Page prose lives in content/ugo.md; it reaches these values only
# through the {tokens} that layouts/partials/ugo-copy.html replaces, so no
# date or price is ever typed into copy (#54).

# ─────────────────────────────────────────────────────────────────────────────
# LIVE MODE — /ugo/ while a trip is on the road (and the strip atop the home
# page). Nothing below renders unless `active` is true.
#
# ▶ ADD TONIGHT'S UPDATE
#   1. Copy this, paste it as the FIRST entry under `updates:`, fill it in:
#
#        - day: 1
#          date: 2026-10-17
#          place: "Zhytomyr"
#          title: "Short headline, as on the video"
#          text: "One or two sentences, e.g. the first line of the YouTube description."
#          youtube: "VIDEO_ID"
#
#      `youtube` is the 11 characters after /shorts/ in the video's link.
#      `text` is optional: delete the line to leave it out.
#      `day` can be text instead of a number, in quotes, for a video before or
#      outside the trip days: day: "Getting ready" reads "Getting ready",
#      not "Day N", and the band drops "is underway".
#   2. Bump any tally figures that changed.
#   3. Save, then: git commit -am "chore(ugo): day 1 update" && git push
#      Netlify deploys main in about a minute.
#
#   Several videos in a day: one entry per video, same `day`, each with its
#   own `place`. The newest one goes on top.
#
#   No laptop? Edit this file on github.com in a phone browser (pencil icon,
#   then "Commit changes" to main); Netlify deploys it the same way. Full
#   runbook: "UGO site update from a phone" in the Obsidian vault. If even that
#   fails, just add the videos to the YouTube playlist below; the page links
#   to it.
#
# The newest update drives everything: the band's day and place, the
# "Updated" stamp, and the featured video. Nothing else needs editing.
#
# AFTER THE TRIP: set `active: false`. The band and the live block disappear;
# the updates stay listed lower on the page as the trip's record.
live:
  active: true
  # The trip these updates belong to, for headings ("UGO 2026 …").
  name: "UGO 2026"
  # The trip's YouTube playlist, linked as "Watch every video on YouTube".
  # The fallback when the site can't be updated: a video added to the
  # playlist shows up there with no site change.
  playlist: PLI3oo5KuS4Pg
  # This trip's running totals. Plain numbers (1000, not "1,000"); the page
  # adds the commas. A figure at 0 is hidden, and the whole tally while every
  # figure is 0, so it appears by itself once the numbers start.
  tally:
    - value: 0
      label: "villages reached"
    - value: 0
      label: "aid boxes given out"
    - value: 0
      label: "*Good and Evil* books given out"
  updates:
    - day: 1
      date: 2026-10-17
      place: "Zhytomyr"
      title: "Power out, red alert, safe"
      text: "We made it to Zhytomyr. The power is out (that's the hotel generator you hear), and we'd just come through our first red-level air alert, the kind that warns of ballistic missiles. All clear now, and we're safe."
      youtube: "GxauYMcpqqg"
    - day: 1
      date: 2026-10-17
      place: "Zhytomyr"
      title: "Pray for our safety"
      text: "On the road to Zhytomyr, our first stop. Attacks on Kyiv and the north have picked up in recent months, and this close to the russian border there's much less warning. Please pray for our team's safety as we head south."
      youtube: "TSLW0p3U2qc"
    - day: "Getting ready"
      date: 2026-10-16
      place: "Lviv"
      title: "Kid-powered: 1,000 starter packets"
      text: "The Day and Steele kids assembled 1,000 Bible First starter packets: Lesson 1, an intro letter, and everything someone needs to enroll in the course. We'll hand them out as we travel through the south."
      youtube: "POHIDlXpnug"
    - day: 0
      date: 2026-10-14
      place: "Lviv"
      title: "1,000 books head south"
      text: "1,000 *Good and Evil* books are on their way south! Nathan, our boys and I loaded them up at Nova Poshta in Lviv, ahead of UGO 2026."
      youtube: "R20rlSg0cfs"
  # Where the videos go out each night. Joshua's own profile is listed first:
  # it has by far the larger following.
  follow:
    - label: "Joshua on Facebook"
      url: "https://www.facebook.com/joshukraine"
      icon: facebook
    - label: "ETO on Facebook"
      url: "https://www.facebook.com/euroteamoutreach"
      icon: facebook
    - label: "ETO on Instagram"
      url: "https://www.instagram.com/euroteamoutreach/"
      icon: instagram
    - label: "ETO on YouTube"
      url: "https://www.youtube.com/@euroteamoutreach"
      icon: youtube
# ─────────────────────────────────────────────────────────────────────────────

# The next project. The ONLY place its dates exist. {trip_dates} renders as
# "October 17–26, 2026"; a trip spanning two months renders both names.
# ⚠️ After the team returns, the "next project" copy in content/ugo.md speaks
# of a trip that is over. Update the dates and that copy together.
trip:
  start: 2026-10-17
  end: 2026-10-26

# The track-record band. Rounded ballparks for boxes and books; Nathan keeps
# the precise records (planning/copy/ugo.md §2). Villages counts only the
# de-occupied south (10 in 2024 + 11 in 2025); the Zhytomyr-area outreach is
# well north of the front and deliberately not included. The books figure is
# UGO-only, and its label says so; the ministry-wide total is on the home
# Good and Evil card (content/_index.md).
stats:
  - value: "2"
    label: "field projects since 2024"
  - value: "21"
    label: "villages reached near the front"
  - value: "1,500"
    label: "aid boxes placed in Ukrainian hands"
  - value: "1,000+"
    label: "*Good and Evil* books given out on UGO trips"

# Box counts for the give band. Each amount is box_price (data/designations.yaml)
# times the count, so a price change rewrites the whole table.
give_band_boxes: [1, 5, 10, 25]

# YouTube playlists of short field updates, newest first.
playlists:
  - title: "UGO 2026"
    list: PLI3oo5KuS4Pg
  - title: "UGO 2025"
    list: PLwBim7LWPkXWNlbUWqyRbQACx3p7EG4Wt
  - title: "UGO 2024"
    list: PLwBim7LWPkXVHyH1OtgqtTQU0SyhVNBzn

# Field photos. `id` is the Cloudinary public ID, verbatim: the uploader added
# a random suffix to each. width/height are the delivered (EXIF-rotated)
# dimensions, used to reserve layout space. Cloudinary applies EXIF orientation
# on delivery, which the two portrait shots and three 180°-stored shots need
# (checked 2026-10-06).
#
# `caption` is the visible figcaption (markdown, for the italic book title);
# `alt` describes the image for someone who cannot see it. Published-copy
# conventions apply: russia/russian lowercase, Lviv without an apostrophe.
#
# Slot → photo mapping: planning/copy/ugo.md §8. Rationale per photo:
# assets/UGO/field-photos/photo-review.md (planning repo).
