# The four giving designations — the single source of truth (#40).
#
# Read by /give/ (layouts/give.html → designation-card.html) and by every
# program give-CTA (give-cta.html). Never hard-code a designation in a template.
#
# ⚠️ LEGALLY LOAD-BEARING (docs/prd/07-donations.md). Designations are always
# CAUSE-framed, never earmarked to a named individual or family (IRS rules for a
# 501(c)(3), #14, #39). This binds hardest on fallen-defender. Stop and ask
# before changing any entry's scope or wording.
#
# Order here is display order, and matches each fund's Position in Givebutter.
#
# Fields:
#   slug             stable ID; also the anchor on /give/ (#ugo-aid-boxes, …)
#   name             exactly as the fund is named in Givebutter's donor dropdown
#   icon             Heroicons outline name → assets/img/icon-{icon}.svg
#   logo             optional ministry mark under assets/, beside the fund name
#                    (decorative: the name already says it)
#   blurb            card copy. "{box_price}" is replaced with the formatted
#                    box_price, so the price lives in one place.
#   box_price        UGO only. $20 comes from 2025 totals and may rise once 2026
#                    cost data is in — change it here and nowhere else.
#   givebutter_fund_id
#                    Givebutter's NUMERIC fund ID (the dashboard's fund CSV
#                    export), not the fund's custom Code: only the numeric ID
#                    pre-selects a fund. give-cta.html builds the deep link
#                    /give/?fund=<id>#give-online from it.

- slug: ugo-aid-boxes
  name: "UGO Aid Boxes"
  icon: gift
  logo: img/ministries/ugo-mini.svg
  box_price: 20
  blurb: "{box_price} fills one box — food and essentials, hand-delivered with the Gospel to a Ukrainian family near the front. Boxes are packed ahead of each trip south, so a gift now helps make the next project possible."
  givebutter_fund_id: 70451

- slug: fallen-defender
  name: "Fallen Defender Fund"
  icon: heart
  blurb: "We walk alongside the widows and children of fallen Ukrainian defenders — families carrying a weight no one should bear alone. Gifts to this fund help us stand with them as God opens the way."
  givebutter_fund_id: 70452

- slug: good-and-evil-printing
  name: "Good & Evil (Ukrainian) Printing"
  icon: book-open
  blurb: "Fund the next printing of the *Good and Evil* book, the Bible's story told in illustrated form, which we translate and hand out across Ukraine. For many readers, it's the first time the whole story, and the Gospel at its heart, comes together."
  givebutter_fund_id: 70453

- slug: general
  name: "Where Most Needed"
  icon: globe-europe-africa
  blurb: "Give to ETO's general fund and trust our team to direct it where the need is greatest."
  givebutter_fund_id: 70454
