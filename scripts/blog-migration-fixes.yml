# Hand decisions for the legacy blog migration, read by scripts/migrate.rb.
#
# Keeping them here, not as edits to the generated posts, means a --force
# re-run reproduces the manual fix pass instead of wiping it.
#
#   alts:   alt text for figures with no caption, keyed by Cloudinary public ID.
#           (Every legacy alt was the literal word "Description".)
#   posts:  per post, keyed by the new slug:
#     description  card text, meta description and share text (required; the
#                  legacy posts had none)
#     body         exact-match replacements in the converted body; each `from`
#                  must occur exactly once or the run fails
#     caption      the same, for the cover caption
#     russia_keep  uses of "Russia"/"Russian" deliberately left capitalized
#                  (inside a direct quotation), one entry per use, as a note

