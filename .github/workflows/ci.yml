name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hugo-build:
    name: Hugo Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # netlify.toml's HUGO_VERSION is the single pin; CI reads it so the two
      # builds can never run different Hugo versions.
      - id: hugo
        run: echo "version=$(sed -n 's/^ *HUGO_VERSION *= *"\([^"]*\)".*/\1/p' netlify.toml)" >> "$GITHUB_OUTPUT"

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.hugo.outputs.version }}

      - run: hugo --gc --minify

      # TEMPORARY — until the blog cutover, production must not build the blog:
      # the legacy site still serves /blog/, and MailChimp polls /feed.xml.
      # hugo.toml blocks them; config/{development,preview}/ open them. This
      # step fails if a config change ever lets them into the production
      # build. Delete it in the cutover PR.
      - name: Production build leaves the blog to legacy
        run: |
          for path in public/blog public/tags public/feed.xml; do
            if [ -e "$path" ]; then
              echo "::error::$path is in the production build; the blog is not cut over yet"
              exit 1
            fi
          done

  lint:
    name: Lint (markdown + prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run lint
