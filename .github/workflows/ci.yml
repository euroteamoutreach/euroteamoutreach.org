name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hugo-build:
    name: Hugo Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # netlify.toml's HUGO_VERSION is the single pin; CI reads it so the two
      # builds can never run different Hugo versions.
      - id: hugo
        run: echo "version=$(sed -n 's/^ *HUGO_VERSION *= *"\([^"]*\)".*/\1/p' netlify.toml)" >> "$GITHUB_OUTPUT"

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.hugo.outputs.version }}

      - run: hugo --gc --minify

  lint:
    name: Lint (markdown + prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run lint
