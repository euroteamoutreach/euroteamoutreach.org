name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hugo-build:
    name: Hugo Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # netlify.toml's HUGO_VERSION is the single pin; CI reads it so the two
      # builds can never run different Hugo versions.
      - id: hugo
        run: echo "version=$(sed -n 's/^ *HUGO_VERSION *= *"\([^"]*\)".*/\1/p' netlify.toml)" >> "$GITHUB_OUTPUT"

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.hugo.outputs.version }}

      - run: hugo --gc --minify

      # Every alias in content/ must reach the generated _redirects file as a
      # 301: a missing line is a legacy URL that 404s (or, worse, falls
      # through to the legacy site). The feed must exist and be well-formed,
      # since MailChimp's RSS campaign reads it.
      - name: Redirects and feed
        run: |
          aliases=$(grep -rhE '^- "?/' content --include='*.md' | wc -l)
          rules=$(grep -c ' 301$' public/_redirects)
          echo "aliases in content: $aliases, 301 rules in _redirects: $rules"
          if [ "$aliases" -eq 0 ] || [ "$aliases" -ne "$rules" ]; then
            echo "::error::public/_redirects has $rules rules for $aliases aliases"
            exit 1
          fi
          python3 -c 'import xml.dom.minidom, sys; xml.dom.minidom.parse("public/feed.xml")'

  lint:
    name: Lint (markdown + prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run lint
