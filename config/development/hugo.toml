# TEMPORARY — opens the blog outside production until the blog cutover.
# Identical to config/preview/hugo.toml; see the comment there. Delete both
# files in the cutover PR, together with the blocks in the root hugo.toml.
[outputs]
  home = ["html", "rss"]

[[cascade]]
  [cascade.build]
    render = "always"
    list = "always"
  [cascade.target]
    path = "{/blog,/blog/**,/tags,/tags/**}"
