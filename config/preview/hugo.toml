# TEMPORARY — opens the blog outside production until the blog cutover.
#
# The root hugo.toml keeps /blog/, /tags/ and /feed.xml out of the build, so
# production keeps serving the legacy blog through the fall-through. That
# block fails closed: any build not named here leaves the blog out. This file
# (deploy previews and branch deploys, HUGO_ENVIRONMENT = "preview") and its
# twin in config/development/ (hugo server) turn the blog back on so it can be
# built and checked before it goes live.
#
# Hugo merges an environment config over the root one, but replaces arrays
# whole: this [[cascade]] replaces the root's, and [outputs] merges by key.
# The /feed.xml built here is harmless: MailChimp polls only the production
# domain, and previews are noindexed.
#
# Delete both files in the cutover PR, together with the root blocks.
[outputs]
  home = ["html", "rss"]

[[cascade]]
  [cascade.build]
    render = "always"
    list = "always"
  [cascade.target]
    path = "{/blog,/blog/**,/tags,/tags/**}"
