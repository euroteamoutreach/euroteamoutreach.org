[build]
  publish = "public"
  command = "npm ci && hugo --gc --minify"

[build.environment]
  HUGO_VERSION = "0.168.0"   # pin — the GitHub Actions CI workflow must pin this exact version
  HUGO_ENVIRONMENT = "production"
  NODE_VERSION = "22"

# ─────────────────────────────────────────────────────────────────────────────
# Preview + branch deploys build with HUGO_ENVIRONMENT = "preview" — NOT
# "development". Do not "clean this up." Two halves must match:
#
#   1. "preview" turns hugo.IsProduction OFF without turning hugo.IsDevelopment
#      ON. IsDevelopment staying false keeps the CSS pipeline in minify +
#      fingerprint mode, so a deploy preview tests exactly what production
#      ships. "development" would flip IsDevelopment true and drop
#      minify/fingerprint — previews would stop testing the real build.
#   2. IsProduction being false lets seo.html emit noindex,nofollow on the
#      *.netlify.app preview/branch URLs, keeping them out of the search index.
#
# ofreport already fought and won this — lift it, don't re-derive it
# (see docs/prd/12-risks-and-open-items.md §"Already Solved").
# ─────────────────────────────────────────────────────────────────────────────

[context.deploy-preview]
  command = "npm ci && hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"
[context.deploy-preview.environment]
  HUGO_ENVIRONMENT = "preview"

[context.branch-deploy]
  command = "npm ci && hugo --gc --minify -b $DEPLOY_PRIME_URL"
[context.branch-deploy.environment]
  HUGO_ENVIRONMENT = "preview"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Self-hosted webfonts. These are served from static/ by absolute /fonts/ path,
# which means they are NOT fingerprinted the way Hugo's asset-pipeline output is
# — this header is what buys back the cache safety that fingerprinting would
# have provided. Safe because the files are immutable: a new weight or subset
# arrives as a NEW filename, never as changed bytes at an existing one. If you
# ever re-subset a font in place, change its filename in the same commit.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Legacy giving URLs → /give/ (redirect-map.md, 07-donations.md). These MUST
# sit above the fall-through below, or it would keep proxying the legacy
# /donate page. /donate/* also catches /donate/thanks/, the legacy post-gift
# page; Givebutter sends its own receipt, so there is no thank-you page to keep.
# Netlify matches with or without the trailing slash, so one rule covers both.
[[redirects]]
  from = "/donate"
  to = "/give/"
  status = 301
  force = true
[[redirects]]
  from = "/donate/*"
  to = "/give/"
  status = 301
  force = true
[[redirects]]
  from = "/donations"
  to = "/give/"
  status = 301
  force = true

# The legacy Formspree confirmation page → the Connect form's no-JS fallback
# (08-forms.md). Above the fall-through for the same reason as the rules above.
[[redirects]]
  from = "/contact/thanks"
  to = "/thank-you/"
  status = 301
  force = true

# Legacy team bios lived at the root; they now nest under /team/
# (10-url-preservation.md). Above the fall-through, like the rules above.
# /chepara is deliberately ABSENT: it keeps falling through to the legacy
# page until the memorial publishes, then 301s to /team/chepara/
# (decision 74). Do not add it here before then.
[[redirects]]
  from = "/day"
  to = "/team/day/"
  status = 301
  force = true
[[redirects]]
  from = "/steele"
  to = "/team/steele/"
  status = 301
  force = true
[[redirects]]
  from = "/sargent"
  to = "/team/sargent/"
  status = 301
  force = true
[[redirects]]
  from = "/patricia"
  to = "/team/patricia/"
  status = 301
  force = true

# ─────────────────────────────────────────────────────────────────────────────
# TEMPORARY — legacy fall-through for the pre-UGO launch track (#21).
#
# Any path this site does not build is served from the legacy Middleman site on
# S3, as a 200 rewrite on our own domain, so no legacy URL 404s at cutover.
# Non-forced: Netlify applies it only when no file exists at the path, so every
# page this site DOES build wins. The hugo.toml cascade decides which paths
# fall through.
#
# The S3 website endpoint is HTTP-only; Netlify fetches it server-side, so
# visitors still see HTTPS. Legacy CSS/JS/images load from its own CloudFront
# asset host, not same-domain paths, so they do not collide with ours.
#
# ⚠️ KEEP THIS THE LAST [[redirects]] RULE. Netlify takes the first match, and a
# /* catch-all shadows every rule below it. Add new redirects ABOVE this one.
#
# Remove when the blog migrates and the full redirect map (Phase 13) lands.
# ─────────────────────────────────────────────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "http://euroteamoutreach.org.s3-website-us-east-1.amazonaws.com/:splat"
  status = 200
